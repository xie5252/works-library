# works-library 主站（xieke.xyz）
# 安装：sudo cp deploy/nginx-xieke.conf /etc/nginx/sites-available/works
#       sudo ln -sf /etc/nginx/sites-available/works /etc/nginx/sites-enabled/works
#       sudo nginx -t && sudo systemctl reload nginx
# HTTPS：DNS 切换后执行 sudo certbot --nginx -d xieke.xyz
server {
    listen 80;
    server_name xieke.xyz;

    # 上传上限（视频 95MB 留余量）
    client_max_body_size 100m;

    # 媒体文件：磁盘直读，永久缓存（文件名随机唯一）
    location /media/ {
        alias /srv/works-library/media/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API：转给 Node 服务
    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态资源 + SPA 回退（/admin、/work/:slug 等返回 index.html）
    root /srv/works-library/dist;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
